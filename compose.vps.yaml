# Use with compose.yaml and the pinned Node image in LEADLOOM_IMAGE.
# Source files are mounted read-only; no application build is needed.
services:
  app:
    build: !reset null
    image: ${LEADLOOM_IMAGE:?Set LEADLOOM_IMAGE to a pinned Node.js 24 image}
    user: '1000:1000'
    working_dir: /app
    command: ['node', 'src/main.mjs']
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    ports: !override ['127.0.0.1:3400:3000']
    volumes: !override
      - ./src:/app/src:ro
      - ./web:/app/web:ro
      - ./package.json:/app/package.json:ro
      - ./data:/app/data
    networks:
      proxy:
        aliases: [leadloom]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-docflow-hub_default}
