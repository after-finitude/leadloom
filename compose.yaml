services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_MODE: ${APP_MODE:-demo}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_PATH: /app/data/leadloom.sqlite
      WORKER_ENABLED: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leadloom.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Leadloom-Demo-2026!}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-manager@leadloom.local}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-Leadloom-Manager-2026!}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-demo-webhook-change-before-use}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Acme <hello@example.com>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-team@example.com}
      EMAIL_ALLOWLIST: ${EMAIL_ALLOWLIST:-}
    volumes:
      - leadloom-data:/app/data
    restart: unless-stopped
volumes:
  leadloom-data:
